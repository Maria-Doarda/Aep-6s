spring.application.name=aep
server.port=8081

# Spring Boot 4 renomeou o prefixo de spring.data.mongodb para spring.mongodb.
# O banco precisa estar na URI: sem /poc_doacoes o driver usa o banco "test".
# A linha "database" abaixo e uma rede de seguranca: vale mesmo se a URI vier sem o path.
spring.mongodb.uri=mongodb://localhost:27017/poc_doacoes
spring.mongodb.database=poc_doacoes

spring.docker.compose.enabled=true

# O indicador "mongo" padrao do Spring Boot 4 consulta tambem o banco "local",
# em que o usuario do Atlas nao tem permissao. Substituido por MongoPingHealthIndicator.
# (no Boot 4 a chave do indicador e "mongodb")
management.health.mongodb.enabled=false


