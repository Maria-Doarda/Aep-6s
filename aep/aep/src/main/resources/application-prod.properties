# Perfil de producao (hospedagem no Render).
# Ativado por SPRING_PROFILES_ACTIVE=prod. As variaveis PORT e MONGO_URI
# sao injetadas pelo painel do Render - nao coloque credenciais no Git.

server.port=${PORT:8081}

# Banco: MongoDB Atlas (a URL precisa terminar com /poc_doacoes).
# Spring Boot 4: o prefixo e spring.mongodb (spring.data.mongodb nao e lido).
spring.mongodb.uri=${MONGO_URI:mongodb://localhost:27017/poc_doacoes}
# Rede de seguranca: sem este nome o startup falha com "Database name must not be empty"
# quando a MONGO_URI e cadastrada sem o path do banco.
spring.mongodb.database=poc_doacoes

# Em produção nao existe Docker Compose para subir o Mongo
spring.docker.compose.enabled=false

# Health check usado pelo Render e pelo monitor de keep-alive
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# Log mais enxuto no plano free
logging.level.org.springframework.data.mongodb.core.MongoTemplate=INFO
